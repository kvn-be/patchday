<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Instrument+Sans:wght@400..600&display=swap"></head>
<body>
<div style="position:relative;min-height:140px;padding:24px;box-sizing:border-box">
<div style="position:absolute;inset:0;overflow:hidden;pointer-events:none"><i class="pd-blob pd-blob-1" style="left:-80px;top:40px;width:300px;height:260px;filter:blur(60px)"></i><i class="pd-blob pd-blob-2" style="left:240px;top:-80px;width:280px;height:220px;filter:blur(60px)"></i><i class="pd-blob pd-blob-3" style="left:520px;top:60px;width:260px;height:220px;filter:blur(60px)"></i></div>
<div style="position:relative">
<div class="pd-glass" style="border-radius:var(--radius-panel);padding:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
  <button class="pd-btn pd-btn-main" type="button">Update all</button>
  <button class="pd-btn pd-btn-line" type="button">Check now</button>
  <button class="pd-btn pd-btn-coffee" type="button">Coffee</button>
  <button class="pd-btn pd-btn-line pd-btn-small" type="button">Skip</button>
  <button class="pd-link" type="button">See the report</button>
</div>
</div>
</div>
</body>
</html>
