<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>WeekDial</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Instrument+Sans:wght@400..600&display=swap"></head>
<body>
<div style="position:relative;min-height:520px;padding:24px;box-sizing:border-box">
<div style="position:absolute;inset:0;overflow:hidden;pointer-events:none"><i class="pd-blob pd-blob-1" style="left:-80px;top:40px;width:300px;height:260px;filter:blur(60px)"></i><i class="pd-blob pd-blob-2" style="left:240px;top:-80px;width:280px;height:220px;filter:blur(60px)"></i><i class="pd-blob pd-blob-3" style="left:520px;top:60px;width:260px;height:220px;filter:blur(60px)"></i></div>
<div style="position:relative">
<div class="pd-glass" style="border-radius:var(--radius-hero);padding:16px;max-width:420px;margin:auto">
  <svg class="pd-dial" id="dial" viewBox="0 0 600 600" role="img" aria-label="Week dial showing the chosen update time"></svg>
  <label for="hour" style="display:grid;gap:4px;margin-top:8px;color:var(--ink-2);font-size:14px;text-align:center">Pick a time: drag the hand or use the slider
    <input id="hour" type="range" min="0" max="167" value="147" style="accent-color:var(--ink)"></label>
</div>
</div>
</div>
<script>window.Patchday.mountWeekDial(document.getElementById('dial'), document.getElementById('hour'), { hour: 147 });</script>
</body>
</html>
