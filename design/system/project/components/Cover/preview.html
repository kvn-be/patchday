<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Cover</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Instrument+Sans:wght@400..600&display=swap">
<style>
  html, body { margin: 0; background: var(--ground); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; }
  .shape { position: absolute; border-radius: 50%; }
  .s1 { left: 420px; top: 40px; width: 360px; height: 320px; background: var(--shape-periwinkle); filter: blur(60px); }
  .s2 { left: 660px; top: -120px; width: 340px; height: 280px; background: var(--shape-sky); filter: blur(60px); }
  .s3 { left: 760px; top: 170px; width: 280px; height: 220px; background: var(--shape-sand); filter: blur(60px); }
  .pane { position: absolute; left: 560px; top: 36px; width: 300px; height: 228px; border-radius: 28px; }
  .dial { position: absolute; left: 610px; top: 50px; }
  .ring { fill: rgba(255, 255, 255, .55); stroke: #ffffff; stroke-width: 1.5; }
  .tick { stroke: var(--ink); stroke-opacity: .35; stroke-width: 2; }
  .hand { stroke: var(--brass); stroke-width: 4; stroke-linecap: round; }
  .pin { fill: var(--brass); }
  .text { position: absolute; left: 40px; bottom: 40px; width: 460px; }
  .name { font: 400 96px/.92 var(--font-display); letter-spacing: -.02em; color: var(--ink); }
  .tag { margin-top: 14px; font: 400 15px/1.4 var(--font-text); color: var(--ink-2); }
</style></head>
<body>
<div class="cover">
  <!-- ground: three shapes in periwinkle, sky and sand, blurred, bleeding top and right.
       glass: one pane with the light top edge, the week dial seen through it.
       motif: the dial with 28 ticks, hand at Sunday night in brass, the only ornament. -->
  <div class="shape s1"></div><div class="shape s2"></div><div class="shape s3"></div>
  <div class="pane pd-glass"></div>
  <svg class="dial" width="200" height="200" viewBox="0 0 200 200" aria-hidden="true">
    <circle class="ring" cx="100" cy="100" r="92"/>
    <g id="ticks"></g>
    <line class="hand" x1="100" y1="100" x2="44" y2="44"/>
    <circle class="pin" cx="100" cy="100" r="6"/>
  </svg>
  <div class="text"><div class="name">Patchday</div><div class="tag">Updates on your schedule, with a way back.</div></div>
</div>
<script>
  var g = document.getElementById('ticks');
  for (var i = 0; i < 28; i++) {
    var a = i / 28 * Math.PI * 2 - Math.PI / 2, long = i % 4 === 0;
    var l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('class', 'tick');
    l.setAttribute('x1', 100 + Math.cos(a) * (long ? 70 : 76)); l.setAttribute('y1', 100 + Math.sin(a) * (long ? 70 : 76));
    l.setAttribute('x2', 100 + Math.cos(a) * 84); l.setAttribute('y2', 100 + Math.sin(a) * 84);
    g.appendChild(l);
  }
</script>
</body>
</html>
