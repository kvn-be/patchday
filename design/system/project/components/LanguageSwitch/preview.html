<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>LanguageSwitch</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Instrument+Sans:wght@400..600&display=swap"></head>
<body>
<div class="pd-row">
  <div class="pd-lang" role="group" aria-label="Language / Sprache">
    <button type="button" aria-pressed="true">EN</button>
    <button type="button" aria-pressed="false">DE</button>
  </div>
</div>
<script>
  document.querySelectorAll('.pd-lang button').forEach(function (button, _, all) {
    button.addEventListener('click', function () {
      all.forEach(function (other) { other.setAttribute('aria-pressed', String(other === button)); });
    });
  });
</script>
</body>
</html>
