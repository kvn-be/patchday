<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Glass</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Instrument+Sans:wght@400..600&display=swap"></head>
<body>
<div style="position:relative;min-height:200px;padding:24px;box-sizing:border-box">
<div style="position:absolute;inset:0;overflow:hidden;pointer-events:none"><i class="pd-blob pd-blob-1" style="left:-80px;top:40px;width:300px;height:260px;filter:blur(60px)"></i><i class="pd-blob pd-blob-2" style="left:240px;top:-80px;width:280px;height:220px;filter:blur(60px)"></i><i class="pd-blob pd-blob-3" style="left:520px;top:60px;width:260px;height:220px;filter:blur(60px)"></i></div>
<div style="position:relative">
<div class="pd-glass" style="border-radius:var(--radius-panel);padding:20px 24px;max-width:420px">
  <div style="font-size:14px;font-weight:600;color:var(--ink-2)">Next run</div>
  <div style="font:400 25px/1.15 var(--font-display);margin-top:8px">Sunday, November 15 at 03:00</div>
</div>
</div>
</div>
</body>
</html>
