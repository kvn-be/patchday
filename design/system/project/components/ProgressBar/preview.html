<!-- @dsCard group="Status" height=120 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProgressBar</title></head>
<body>
<div style="display:grid;gap:14px;padding:16px">
  <div class="pd-progress" role="progressbar" aria-label="Running" aria-valuenow="35"><span style="width:35%"></span></div>
  <div class="pd-progress pd-progress-busy" role="progressbar" aria-label="Installing"><span></span></div>
  <div class="pd-progress pd-progress-ok" role="progressbar" aria-label="Applied" aria-valuenow="100"><span style="width:100%"></span></div>
  <div class="pd-progress pd-progress-fail" role="progressbar" aria-label="Failed" aria-valuenow="100"><span style="width:100%"></span></div>
</div>
</body>
</html>
