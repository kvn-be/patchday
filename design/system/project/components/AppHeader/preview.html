<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AppHeader</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Instrument+Sans:wght@400..600&display=swap"></head>
<body>
<header class="pd-header">
  <a class="pd-brand" href="#" aria-label="Patchday, back to top"><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15.5" fill="none" stroke="var(--brass)" stroke-width="1.6"/><circle cx="17" cy="17" r="11" fill="var(--night-sunk)"/><path d="M17 17 9.6 10.6" stroke="var(--brass)" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="17" r="2.2" fill="var(--brass)"/></svg><b>Patchday</b></a>
  <span class="pd-badge pd-badge-plain">Preview 0.1</span>
  <div class="pd-header-tools">
    <div class="pd-lang" role="group" aria-label="Language / Sprache"><button type="button" aria-pressed="true">EN</button><button type="button" aria-pressed="false">DE</button></div>
    <button class="pd-btn pd-btn-icon" type="button" aria-label="Switch to light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" stroke-linejoin="round"/></svg></button>
    <a class="pd-btn pd-btn-coffee" href="https://ko-fi.com/kvnbe" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9Z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3.5v2M12.5 3.5v2"/></svg>Buy me a coffee</a>
  </div>
</header>
</body>
</html>
