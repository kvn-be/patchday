<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ground</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Instrument+Sans:wght@400..600&display=swap"></head>
<body>
<div style="position:relative;min-height:220px;padding:24px;box-sizing:border-box">
<div style="position:absolute;inset:0;overflow:hidden;pointer-events:none"><i class="pd-blob pd-blob-1" style="left:-80px;top:40px;width:300px;height:260px;filter:blur(60px)"></i><i class="pd-blob pd-blob-2" style="left:240px;top:-80px;width:280px;height:220px;filter:blur(60px)"></i><i class="pd-blob pd-blob-3" style="left:520px;top:60px;width:260px;height:220px;filter:blur(60px)"></i></div>
<div style="position:relative">
<div class="pd-glass" style="border-radius:var(--radius-panel);padding:20px 24px;max-width:460px">
  <div style="font:400 25px/1.15 var(--font-display)">Move the pointer</div>
  <p style="margin:8px 0 0;color:var(--ink-2)">The shapes behind this glass drift slightly against it.</p>
</div>
</div>
</div>
<script>window.Patchday.startParallax();</script>
</body>
</html>
