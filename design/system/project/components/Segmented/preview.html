<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Segmented</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Instrument+Sans:wght@400..600&display=swap"></head>
<body>
<div style="position:relative;min-height:120px;padding:24px;box-sizing:border-box">
<div style="position:absolute;inset:0;overflow:hidden;pointer-events:none"><i class="pd-blob pd-blob-1" style="left:-80px;top:40px;width:300px;height:260px;filter:blur(60px)"></i><i class="pd-blob pd-blob-2" style="left:240px;top:-80px;width:280px;height:220px;filter:blur(60px)"></i><i class="pd-blob pd-blob-3" style="left:520px;top:60px;width:260px;height:220px;filter:blur(60px)"></i></div>
<div style="position:relative">
<div style="display:flex;gap:16px;align-items:center">
  <div class="pd-segmented" role="group" aria-label="Show"><button type="button" aria-pressed="true">All 44</button><button type="button" aria-pressed="false">With updates 10</button></div>
  <div class="pd-segmented pd-segmented-small" role="group" aria-label="Language"><button type="button" aria-pressed="true">EN</button><button type="button" aria-pressed="false">DE</button></div>
</div>
</div>
</div>
<script>document.querySelectorAll('.pd-segmented').forEach(function (g) { g.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { g.querySelectorAll('button').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); }); }); }); });</script>
</body>
</html>
