<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CommandField</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Instrument+Sans:wght@400..600&display=swap"></head>
<body>
<div style="padding:16px"><div class="pd-cmd"><code id="cmd">brew install --cask kvn-be/tap/patchday</code><button class="pd-btn pd-btn-line" type="button" id="copy">Copy</button></div></div>
<script>
  document.getElementById('copy').addEventListener('click', function () {
    var button = this;
    navigator.clipboard.writeText(document.getElementById('cmd').textContent).then(function () {
      button.textContent = 'Copied';
      setTimeout(function () { button.textContent = 'Copy'; }, 1600);
    }).catch(function () { getSelection().selectAllChildren(document.getElementById('cmd')); });
  });
</script>
</body>
</html>
