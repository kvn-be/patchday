<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Cover</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Instrument+Sans:wght@400..600&display=swap">
<style>
  html, body { margin: 0; background: var(--night); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; }
  .cover svg { position: absolute; inset: 0; }
  .b-brass { fill: var(--brass); } .b-raised { fill: var(--control-line); } .b-wait { fill: var(--wait); } .b-moon { fill: var(--moon); }
  .ring { fill: none; stroke: var(--night); stroke-width: 2; }
  .tick { stroke: var(--night); stroke-width: 2.5; }
  .hand { stroke: var(--night); stroke-width: 5; stroke-linecap: round; }
  .pin { fill: var(--night); }
  .text { position: absolute; left: 40px; bottom: 36px; width: 440px; }
  .name { font: 400 96px/.92 var(--font-display); letter-spacing: -.02em; color: var(--moon); }
  .tag { margin-top: 12px; font: 400 14px/1.4 var(--font-text); color: var(--haze); }
</style></head>
<body>
<div class="cover">
  <!-- blocks: brass 280x188, wait 160x112, moon 120x112, control-line 200x300, all flush.
       arrangement: modular slabs right of x=480, meeting at the dial centre, bleeding top, right and bottom.
       pattern: literal motif, the week dial: 28 ticks and two rings, because the dial is the product's signature.
       scales: square corners on blocks, 4 ticks per day, 7 long ones, stroke from the logo. -->
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <rect class="b-brass" x="480" y="0" width="280" height="188"/>
    <rect class="b-raised" x="760" y="0" width="200" height="300"/>
    <rect class="b-wait" x="480" y="188" width="160" height="112"/>
    <rect class="b-moon" x="640" y="188" width="120" height="112"/>
    <circle class="ring" cx="760" cy="188" r="140"/>
    <line class="tick" x1="760.0" y1="38.0" x2="760.0" y2="14.0"/><line class="tick" x1="795.6" y1="32.0" x2="798.7" y2="18.4"/><line class="tick" x1="829.4" y1="43.8" x2="835.5" y2="31.2"/><line class="tick" x1="859.8" y1="62.9" x2="868.5" y2="52.0"/><line class="tick" x1="877.3" y1="94.5" x2="896.0" y2="79.5"/><line class="tick" x1="904.2" y1="118.6" x2="916.8" y2="112.5"/><line class="tick" x1="916.0" y1="152.4" x2="929.6" y2="149.3"/><line class="tick" x1="920.0" y1="188.0" x2="934.0" y2="188.0"/><line class="tick" x1="906.2" y1="221.4" x2="929.6" y2="226.7"/><line class="tick" x1="904.2" y1="257.4" x2="916.8" y2="263.5"/><line class="tick" x1="885.1" y1="287.8" x2="896.0" y2="296.5"/><line class="tick" x1="859.8" y1="313.1" x2="868.5" y2="324.0"/><line class="tick" x1="825.1" y1="323.1" x2="835.5" y2="344.8"/><line class="tick" x1="795.6" y1="344.0" x2="798.7" y2="357.6"/><line class="tick" x1="760.0" y1="348.0" x2="760.0" y2="362.0"/><line class="tick" x1="724.4" y1="344.0" x2="721.3" y2="357.6"/><line class="tick" x1="694.9" y1="323.1" x2="684.5" y2="344.8"/><line class="tick" x1="660.2" y1="313.1" x2="651.5" y2="324.0"/><line class="tick" x1="634.9" y1="287.8" x2="624.0" y2="296.5"/><line class="tick" x1="615.8" y1="257.4" x2="603.2" y2="263.5"/><line class="tick" x1="613.8" y1="221.4" x2="590.4" y2="226.7"/><line class="tick" x1="600.0" y1="188.0" x2="586.0" y2="188.0"/><line class="tick" x1="604.0" y1="152.4" x2="590.4" y2="149.3"/><line class="tick" x1="615.8" y1="118.6" x2="603.2" y2="112.5"/><line class="tick" x1="642.7" y1="94.5" x2="624.0" y2="79.5"/><line class="tick" x1="660.2" y1="62.9" x2="651.5" y2="52.0"/><line class="tick" x1="690.6" y1="43.8" x2="684.5" y2="31.2"/><line class="tick" x1="724.4" y1="32.0" x2="721.3" y2="18.4"/>
    <line class="hand" x1="760" y1="188" x2="663.8" y2="91.8"/>
    <circle class="pin" cx="760" cy="188" r="9"/>
  </svg>
  <div class="text"><div class="name">Patchday</div><div class="tag">Updates on your schedule, with a way back.</div></div>
</div>
</body>
</html>
